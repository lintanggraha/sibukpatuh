  {
    "@context": "https://schema.org",

        "@type": "Question",
        "name": "Apa itu ISO 27001?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "ISO 27001:2022 adalah standar internasional untuk Sistem Manajemen Keamanan Informasi (SMKI) yang memuat 93 kontrol keamanan dalam 4 tema: Organizational, People, Physical, dan Technological Controls. Di Indonesia diadopsi sebagai SNI ISO/IEC 27001:2022."
        }
      },
      {
        "@type": "Question",
        "name": "Apa itu NIST CSF 2.0?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "NIST Cybersecurity Framework 2.0 adalah kerangka kerja keamanan siber dari NIST Amerika Serikat dengan 6 fungsi: Govern, Identify, Protect, Detect, Respond, dan Recover. Versi 2.0 dirilis Februari 2024 dengan penambahan fungsi Govern."
        }
      },
      {
        "@type": "Question",
        "name": "Apa itu SEOJK 29/2022?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "SEOJK No. 29/SEOJK.03/2022 adalah Surat Edaran OJK tentang Ketahanan dan Keamanan Siber bagi Bank Umum yang mewajibkan implementasi kerangka kerja keamanan siber, self-assessment, dan pelaporan insiden siber kepada OJK."
        }
      },
      {
        "@type": "Question",
        "name": "Apa itu UU PDP?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "UU PDP (Undang-Undang No. 27 Tahun 2022 tentang Pelindungan Data Pribadi) adalah regulasi perlindungan data pribadi Indonesia yang mengatur hak subjek data, kewajiban pengendali data, dan sanksi pelanggaran. Berlaku penuh sejak Oktober 2024."
        }
      },
      {
        "@type": "Question",
        "name": "Apa itu COBIT 2019?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "COBIT 2019 adalah framework tata kelola dan manajemen TI dari ISACA dengan 40 tujuan yang dikelompokkan dalam 5 domain: EDM, APO, BAI, DSS, dan MEA. Digunakan sebagai referensi audit TI perbankan di Indonesia."
        }
      },
      {
        "@type": "Question",
        "name": "Apa itu Gap Analysis kepatuhan siber?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Gap Analysis kepatuhan siber adalah proses evaluasi untuk mengidentifikasi kesenjangan antara kondisi keamanan siber organisasi saat ini dengan persyaratan standar atau regulasi yang berlaku seperti ISO 27001, NIST CSF, atau SEOJK."
        }
      }
    ]
  }
